[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octobot-backtesting"
version = "1.10.0"
description = "OctoBot project backtesting engine"
readme = "README.md"
license = "LGPL-3.0"
requires-python = ">=3.13"
authors = [
    { name = "Drakkar-Software", email = "contact@drakkar.software" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "async-channel>=2.2,<2.3",
    "octobot-commons>=1.10,<1.11",
    "octobot-tentacles-manager>=2.10,<2.11",
    "aiohttp>=3.9.5",
]

[project.optional-dependencies]
full = [
    "octobot-commons[full]>=1.10,<1.11",
    "octobot-tentacles-manager[full]>=2.10,<2.11",
]

[project.urls]
Homepage = "https://github.com/Drakkar-Software/OctoBot-Backtesting"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/octobot_backtesting"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["octobot_backtesting"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
